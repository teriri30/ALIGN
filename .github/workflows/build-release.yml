name: build-release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
      release_tag:
        description: "Optional release tag, for example v0.1.0; leave empty for an artifact-only build"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      ALIGN_DISABLE_AUTO_START: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            developer/requirements/requirements-release.txt
            developer/requirements/requirements-ci.txt
            developer/requirements/requirements-build.txt
      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # The development environment remains CUDA-enabled.  The public
          # portable ZIP uses CPU PyTorch so the bundled runtime stays below
          # GitHub's single-release-asset size limit and runs on any Windows
          # machine without a separately installed CUDA toolkit.
          python -m pip install -r developer/requirements/requirements-release.txt -r developer/requirements/requirements-ci.txt -r developer/requirements/requirements-build.txt
      - name: Configure geospatial data paths
        shell: pwsh
        run: |
          $proj = & python -c "import rasterio, os; print(os.path.join(os.path.dirname(rasterio.__file__), 'proj_data'))"
          Add-Content -Path $env:GITHUB_ENV -Value "PROJ_DATA=$proj"
          Add-Content -Path $env:GITHUB_ENV -Value "PROJ_LIB=$proj"
      - name: Static checks, compile and tests
        shell: pwsh
        run: |
          python -m ruff check --select E9,F63,F7,F82 .
          python -m compileall -q .
          python -m pytest -q --cov=. --cov-report=term --cov-fail-under=35
          python -m pip check
      - name: Generate build metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME.TrimStart("v") }
          elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.release_tag }}")) { $version = "${{ inputs.release_tag }}".TrimStart("v") }
          else { $version = "0.1.0-dev" }
          $channel = "${{ inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "stable" }
          python scripts/generate_build_info.py --version $version --channel $channel
      - name: Build PyInstaller bundle
        shell: pwsh
        run: python -m PyInstaller packaging/align.spec --noconfirm --clean
      - name: Frozen bundle self-test
        shell: pwsh
        run: dist/align/align.exe --self-test
      - name: Package and checksum
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content build_info.json -Raw | ConvertFrom-Json).version
          Copy-Item build_info.json dist/align/version.json -Force
          Copy-Item packaging/README-Windows.txt dist/align/README-Windows.txt -Force
          $zip = "align-Windows-x64-v$version.zip"
          Compress-Archive -Path dist/align/* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          $size = (Get-Item $zip).Length
          if ($size -ge 2040109465) { throw "Release ZIP is >= 1.9 GiB; split runtime and model assets before publishing." }
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append
          "sha=$zip.sha256" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Created $zip ($size bytes)"
      - name: Build Windows installer
        id: installer
        shell: pwsh
        run: |
          # Actions 的 pwsh 默认 EAP=stop，原生命令写一行 stderr 就会掐断 step，先放宽。
          $ErrorActionPreference = "Continue"
          $version = (Get-Content build_info.json -Raw | ConvertFrom-Json).version
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup 未预装，尝试 choco 安装"
            choco install innosetup --no-progress -y *> choco-install.log
            Get-Content choco-install.log -Tail 10 | Write-Host
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe，无法生成安装包" }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          & $iscc "/DMyAppVersion=$version" "packaging\align_setup.iss" *> installer-build.log
          $code = $LASTEXITCODE
          Get-Content installer-build.log -Tail 40 | Write-Host
          if ($code -ne 0) { throw "ISCC 失败，退出码 $code（见 installer-build.log）" }
          $setup = Get-ChildItem installer -Filter "align-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "安装包未生成" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content "$($setup.FullName).sha256" -Encoding ascii
          $size = $setup.Length
          if ($size -ge 2040109465) { throw "安装包 >= 1.9 GiB，超出 Release 单文件上限" }
          "setup=$($setup.Name)" | Out-File $env:GITHUB_OUTPUT -Append
          "setup_path=$($setup.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          "setup_sha=$($setup.FullName).sha256" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Created $($setup.Name) ($size bytes)"
      - name: Publish installer build log
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path installer-build.log)) { exit 0 }
          foreach ($line in (Get-Content installer-build.log | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -Last 25)) {
            $safe = $line.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=ISCC::$safe"
          }
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: align-windows-portable
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
            installer\align-Setup-*.exe
            installer\align-Setup-*.exe.sha256
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        shell: pwsh
        run: |
          # 发布逻辑放在 py 里：gh CLI 在 pwsh 下的参数/退出码行为难排查，
          # 脚本自己会打印 ::error:: 注解，失败原因直接出现在 check-run。
          $env:GITHUB_REF_NAME = "$env:RELEASE_TAG"
          python scripts/publish_release.py "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.sha }}" "installer/${{ steps.installer.outputs.setup }}" "installer/${{ steps.installer.outputs.setup }}.sha256"
