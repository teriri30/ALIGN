name: tests

on:
  push:
  pull_request:

jobs:
  windows-py310:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      REUI_DISABLE_AUTO_START: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: developer/requirements/requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r developer/requirements/requirements-ci.txt
      - name: Fix PROJ_DATA for rasterio+pyproj compatibility
        shell: pwsh
        run: |
          $proj_data = & python -c "import rasterio, os; print(os.path.join(os.path.dirname(rasterio.__file__), 'proj_data'))"
          Add-Content -Path $env:GITHUB_ENV -Value "PROJ_LIB=$proj_data"
          Add-Content -Path $env:GITHUB_ENV -Value "PROJ_DATA=$proj_data"
          Write-Host "PROJ paths set to: $proj_data"
      - name: Static checks
        run: python -m ruff check --select E9,F63,F7,F82 .
      - name: Compile source
        run: python -m compileall -q .
      - name: Run tests with coverage
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $base_temp = Join-Path $env:RUNNER_TEMP "reui-pytest"
          New-Item -ItemType Directory -Force -Path $base_temp | Out-Null
          python -m pytest -q `
            --basetemp "$base_temp" `
            --cov=. --cov-report=term --cov-report=xml:coverage.xml `
            --junitxml=test-results.xml --cov-fail-under=35
      - name: Summarize test failures
        if: always()
        shell: pwsh
        run: |
          $summary_script = @'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("test-results.xml")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Pytest failure summary\n\n")
              if not report.is_file():
                  handle.write("JUnit report was not produced.\n")
              else:
                  root = ElementTree.parse(report).getroot()
                  failures = []
                  for case in root.iter("testcase"):
                      node = case.find("failure")
                      if node is None:
                          node = case.find("error")
                      if node is None:
                          continue
                      name = ".".join(
                          part for part in (case.get("classname"), case.get("name"))
                          if part
                      )
                      details = (node.text or node.get("message") or "").strip()
                      failures.append((name or "unknown test", details))
                  if not failures:
                      handle.write("No failed testcase was recorded in the JUnit report.\n")
                  else:
                      handle.write(f"Failed tests: {len(failures)}\n\n")
                      for name, details in failures:
                          safe_details = details.replace("```", "[triple-backtick]")[:8000]
                          handle.write(f"### `{name}`\n\n```text\n{safe_details}\n```\n\n")
                          # Expose the failing test through the public check-run
                          # annotations as well as the step summary.  Anonymous
                          # callers can read annotations even when Actions logs
                          # and artifact downloads require authentication.
                          annotation = f"{name}: {details[:1500]}".replace("%", "%25")
                          annotation = annotation.replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error title=Pytest failure::{annotation}")
          '@
          $summary_script | python -
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            coverage.xml
            test-results.xml
            .pytest_cache
